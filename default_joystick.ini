; Retro RP2040 Competition Pro factory defaults
; Each direction and button accepts one output, or NONE to disable it.
; Joystick: UP DOWN LEFT RIGHT. Gamepad: JOY1 JOY2 JOY3 JOY4.
; Keyboard: A-Z, 0-9, ENTER ESC BACKSPACE TAB SPACE, or F1-F12.
; Modifiers: SHIFT CTRL ALT. Combine with +, for example SHIFT+A.
; Add :AUTOFIRE, optionally followed by :<delay>MS and/or :<rate>HZ.
; Example: JOY1:AUTOFIRE:500MS:25HZ. MS and HZ may appear in either order.
; Without HZ, autofire uses the global 1-100 Hz rate. Big Fire 1 + Small Fire
; 1 decreases that rate; Big Fire 2 + Small Fire 1 increases it. The profile
; LED blinks at the adjusted rate while that gesture is active.
; A binding with HZ, such as :8HZ or :25HZ, keeps its fixed rate and ignores
; those gestures. MS delays activation; it does not change the rate.
; Reverse axes by swapping values, for example up=DOWN and down=UP.

[RED]
; One-button systems: C64, Amiga, Atari 2600, Atari ST and ZX Spectrum.
; Button 1 works normally, then autofires at the adjustable global rate after 500MS.
; Button 2 emits SPACE, useful for games like Turrican.
; Button 3 and 4 provide fixed fast and slow autofire at 25 Hz and 5 Hz.
button1=JOY1:AUTOFIRE:500MS
button2=SPACE
button3=JOY1:AUTOFIRE:25HZ
button4=JOY1:AUTOFIRE:5HZ
up=UP
down=DOWN
left=LEFT
right=RIGHT

[BLUE]
; Two-button systems: NES/Famicom, Master System, Game Boy and Atari 7800.
; Big buttons provide normal A/B; small buttons provide adjustable autofire A/B.
button1=JOY1
button2=JOY2
button3=JOY1:AUTOFIRE
button4=JOY2:AUTOFIRE
up=UP
down=DOWN
left=LEFT
right=RIGHT

[GREEN]
; Three-button systems: Mega Drive/Genesis A, B and C.
; Button 3 is the normal C button; button 4 demonstrates fixed-rate autofire.
button1=JOY1
button2=JOY2
button3=JOY3
button4=JOY3:AUTOFIRE:25HZ
up=UP
down=DOWN
left=LEFT
right=RIGHT

[YELLOW]
; Four-button systems: SNES/Super Famicom, Neo Geo and similar controllers.
; Button one has a delayed fixed autofire 
button1=JOY1:AUTOFIRE:500MS:25HZ 
button2=JOY2
button3=JOY3
button4=JOY4
up=UP
down=DOWN
left=LEFT
right=RIGHT
